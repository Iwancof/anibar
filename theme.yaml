# ── フォント ────────────────────────────────
font:
  family:    "Consolas, Noto Sans Mono CJK JP, monospace"
  clock-size: 17px

font-icon: "HackGen Console NF"

# ── 色 ──────────────────────────────────────
colors:
  bg:        "#0d1118"
  panel:     "#141a24"
  surface:   "#1a2230"
  surface-2: "#111722"
  text:      "#d5def4"
  muted:     "#8a95b3"
  outline:   "rgba(164, 178, 215, 0.18)"
  healthy:   "#9ece6a"
  warning:   "#e0af68"
  critical:  "#f7768e"
  accent:    "#7aa2f7"

hud:
  cyan:   "#00ffcc"
  blue:   "#00aaff"
  amber:  "#ffaa00"
  pink:   "#ff2266"
  border: "#1a1e2e"
  text:   "#e0e6f0"

np:
  bg0:       "#080c12"
  bg1:       "#0d1219"
  bg2:       "#121a24"
  bg3:       "#182030"
  cyan:      "#00e5ff"
  cyan-dim:  "#007a8a"
  magenta:   "#ff2d78"
  amber:     "#ffb627"
  green:     "#00ff9d"
  red:       "#ff3d3d"
  text:      "#c8d3e0"
  text-sec:  "#5a6a7e"
  text-dim:  "#2e3d50"
  border:    "#1a2436"

popup:
  panel-bg:      "rgba(12, 14, 20, 0.75)"
  shadow:        "0 8px 32px rgba(0, 0, 0, 0.6)"
  backdrop:      "#080a10"
  backdrop-rgb:  "8, 10, 16"
  anim-close-ms: 200

radius:
  xs:   2px
  sm:   4px
  md:   6px
  lg:   8px
  pill: 999px

fontsize:
  caption: 10px
  dense:   11px
  body:    12px
  emph:    14px
  title:   17px
  display: 26px
  hero:    46px

space:
  1: 4px
  2: 8px
  3: 12px
  4: 16px
  5: 24px

dim:
  panel-main:  520
  panel-side:  380
  label-sm:    80
  slots-ap:    50
  slots-notif: 20
  slots-flows: 15
  slots-log:   30

# ── バー ────────────────────────────────────
bar:
  battery-green:  "#9ecf6b"
  battery-amber:  "#e3a669"
  battery-charge: "#66e6cc"
  margin:        "2px 2px 0"     # 外側余白 (上 左右 下)
  padding:       "2px 8px"      # 内側余白 (上下 左右)
  border-radius: 6px
  background:    "rgba(20, 26, 36, 0.92)"
  border:        "1px solid"

  button:
    padding:       "0px 10px"
    border-radius: 8px

  indicator:
    icon-size:  13px
    label-size: 13px

chart:
  green: "#00ff9e"
  cyan:  "#008fff"
  dim:   "#5c6b80"
  amber: "#ffb526"
  red:   "#ff3d3d"

# ── ダッシュボード ──────────────────────────
dashboard:
  backdrop:    "rgba(8, 10, 16, 0.74)"
  backdrop-padding: 32px

  panel:
    min-width:     500px
    padding:       24px
    border-radius: 24px
    shadow:        "0 24px 64px rgba(0, 0, 0, 0.48)"

  header:
    margin-bottom: 4px
    eyebrow-size:  12px
    title-size:    26px

  close:
    padding:       "10px 14px"
    border-radius: 12px

# ── モジュールカード ────────────────────────
module-card:
  padding:       16px
  border-radius: 18px
  title-size:    12px
  headline-size: 20px
  meta-size:     12px
  footer-size:   12px

# ── サービス行 ──────────────────────────────
service-row:
  padding:       "8px 10px"
  border-radius: 10px

# ── トーン (左ボーダー幅) ──────────────────
tone:
  border-width: 4px
  muted-color:  "rgba(138, 149, 179, 0.48)"

# ── スペクトラム (CAVA) ──────────────────────
spectrum:
  bars:            48
  framerate:       60
  sensitivity:     150
  noise-reduction: 0

# ── ネットワークパネル ────────────────────────
network-panel:
  font-family:      "Consolas"
  # セクション
  section-label:    14px
  section-padding:  "9px 13px"
  # Identity 等の情報行
  info-label:       13px
  info-value:       15px
  geo-label:        12px
  # APs
  ap-ssid:          14px

# ── プレビュー ──────────────────────────────
preview:
  padding:       24px
  title-size:    28px
  frame-radius:  28px
  frame-padding: 16px
